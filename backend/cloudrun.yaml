# Reference Cloud Run container settings. Provide secrets as Secret Manager-backed env vars.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kebabzilla-api
spec:
  template:
    spec:
      containerConcurrency: 80
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/REPOSITORY/kebabzilla-api:TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
