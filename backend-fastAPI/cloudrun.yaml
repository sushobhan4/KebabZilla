# Cloud Run Service Definition for KebabZilla API with Cloud SQL
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kebabzilla-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/kebabzilla-api:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              # Supabase PostgreSQL Pooler format (Session mode, Port 5432):
              value: "postgresql+psycopg://postgres.PROJECT_REF:DB_PASSWORD@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require"
            - name: CORS_ORIGINS
              # Comma-separated frontend domains (e.g. GitHub Pages or custom domain)
              value: "https://your-username.github.io,https://kebabzilla.in"
            - name: JWT_SECRET
              value: "replace-with-a-random-32-plus-char-secret-key-here"
            - name: SEED_ADMIN_EMAIL
              value: "admin@kebabzilla.in"
            - name: SEED_ADMIN_PASSWORD
              value: "replace-with-secure-admin-password"
            - name: GCS_BUCKET_NAME
              value: "kebabzilla_cloud_storage"
            - name: GCS_PROJECT_ID
              value: "PROJECT_ID"
            # Optional integrations:
            # - name: RAZORPAY_KEY_ID
            #   value: "rzp_live_..."
            # - name: RAZORPAY_KEY_SECRET
            #   value: "..."
            # - name: GOOGLE_CLIENT_ID
            #   value: "..."
            # - name: GOOGLE_MAPS_API_KEY
            #   value: "..."
            # - name: SMTP_PASSWORD
            #   value: "..."
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
